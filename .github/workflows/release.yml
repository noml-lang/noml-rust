name: Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild missing binaries for (e.g. v0.9.1)'
        required: true

env:
  CARGO_TERM_COLOR: always
  # The tag being released: the pushed tag, or the one given to a manual run
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: write  # Required for creating releases and uploading assets
  pages: write     # Required for deploying to GitHub Pages
  id-token: write  # Required for GitHub Pages deployment

jobs:
  # ============================================================================
  # Create GitHub Release
  # ============================================================================
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0  # Full history for changelog

      - name: Get version from tag
        id: get_version
        run: echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Extract changelog for this version
          if [[ -f CHANGELOG.md ]]; then
            # Get content between version headers
            awk '/^## \['"${{ steps.get_version.outputs.version }}"'\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md > release_notes.md
          else
            echo "Release ${{ steps.get_version.outputs.version }}" > release_notes.md
          fi

      - name: Create Release
        id: create_release
        run: |
          # A release may already exist (created by hand, or a re-run); keep it
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi

          gh release create "$TAG" \
            --title "Release ${{ steps.get_version.outputs.version }}" \
            --notes-file release_notes.md \
            --verify-tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # Build and upload release binaries
  # ============================================================================
  build-release:
    name: Build Release
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: noml
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: noml.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: noml

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/${{ matrix.binary_name }}

      - name: Create archive
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            archive_name="noml-${{ needs.create-release.outputs.version }}-${{ matrix.target }}.zip"
            7z a "$archive_name" ./target/${{ matrix.target }}/release/${{ matrix.binary_name }}
          else
            archive_name="noml-${{ needs.create-release.outputs.version }}-${{ matrix.target }}.tar.gz"
            tar -czf "$archive_name" -C target/${{ matrix.target }}/release ${{ matrix.binary_name }}
          fi
          echo "ARCHIVE_NAME=$archive_name" >> $GITHUB_ENV

      # Run under bash on every runner: the archive path is relative, so it
      # works the same on Windows (pwsh could not resolve the MSYS-style
      # absolute path the previous version used).
      - name: Upload Release Asset
        shell: bash
        run: |
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qxF "$ARCHIVE_NAME"; then
            echo "$ARCHIVE_NAME is already attached to $TAG"
          else
            gh release upload "$TAG" "$ARCHIVE_NAME"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # Publish to crates.io
  # ============================================================================
  publish-crate:
    name: Publish to Crates.io
    needs: [create-release, build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify version matches tag
        run: |
          cargo_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          tag_version="${{ needs.create-release.outputs.version }}"
          if [[ "$cargo_version" != "$tag_version" ]]; then
            echo "Version mismatch: Cargo.toml has $cargo_version, tag is $tag_version"
            exit 1
          fi

      # Publishing is skipped when the version is already on crates.io (it may
      # have been published by hand, or this is a re-run) or when no registry
      # token is configured for the repository.
      - name: Publish to crates.io
        run: |
          version="${{ needs.create-release.outputs.version }}"
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "noml-release-workflow (github.com/noml-lang/noml-rust)" \
            "https://crates.io/api/v1/crates/noml/$version")
          if [[ "$status" == "200" ]]; then
            echo "noml $version is already on crates.io; nothing to publish"
          elif [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set; skipping cargo publish"
          else
            cargo publish --locked
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ============================================================================
  # Update documentation
  # ============================================================================
  update-docs:
    name: Update Documentation
    needs: publish-crate
    runs-on: ubuntu-latest
    # Only for new tags; a manual rebuild of an old release must not replace
    # the published docs with older ones
    if: always() && github.event_name == 'push' && needs.publish-crate.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build documentation
        run: cargo doc --all-features --no-deps

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/doc
          destination_dir: api
